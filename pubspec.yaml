name: cloud_audio_player
description: "Cloud Audio Player with Background Streaming & Galaxy S26+ Widget Stack Support."
publish_to: 'none'

version: 1.0.0+3002

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  audio_service: ^0.18.15
  audio_session: ^0.1.25
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  crypto: ^3.0.7
  intl: ^0.20.3
  xml: ^7.1.0
  file_picker: ^13.1.0
  window_manager: ^0.5.2
  permission_handler: ^11.3.1
  google_sign_in: ^6.2.1
  path_provider: ^2.1.5
  screen_brightness: ^2.1.11
  flutter_volume_controller: ^2.0.2
  fast_gbk: ^1.0.0
  charset_converter: ^2.5.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
